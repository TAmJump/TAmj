<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>115en</title>
<meta name="description" content="医療・介護・地域をつなぐ、ご縁のグループ。株式会社GMS、株式会社さかえケアサービス、特定非営利活動法人 GO TO HAPPY LIFE ほか。">
<meta property="og:title" content="115en">
<meta property="og:description" content="医療・介護・地域をつなぐ、ご縁のグループ">
<meta property="og:type" content="website">
<meta property="og:url" content="https://115en.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF6EE; --paper:#FFFDF8; --ink:#1a1a1a; --muted:#7a746a; --line:#e6dfd2; --red:#C8161D;
  --en:"Cormorant Garamond",Georgia,serif; --jp:"Noto Serif JP","Hiragino Mincho ProN",serif;
  --side:max(20px,4vw);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.9 var(--jp);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* 上下の帯 */
.top,.bottom{position:fixed;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:18px max(var(--side),env(safe-area-inset-left,0px)) 18px max(var(--side),env(safe-area-inset-right,0px));pointer-events:none}
.top{top:0}.bottom{bottom:0}
.top>*,.bottom>*{pointer-events:auto}
.mark{font-family:var(--en);font-weight:600;font-size:26px;letter-spacing:.06em}
.mark span{color:var(--red)}
.mark small{display:block;font-family:var(--jp);font-weight:400;font-size:10px;letter-spacing:.3em;color:var(--muted);margin-top:-4px}
.close{font-family:var(--en);font-size:14px;letter-spacing:.2em;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 16px;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .4s}
body.open .close{opacity:1;visibility:visible}
.copy{font-family:var(--en);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.tiger{font-family:var(--en);font-style:italic;font-size:14px;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.tiger:hover,.tiger:focus-visible{color:var(--red);border-color:var(--red)}

/* 1枚目：画像 */
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:84px var(--side) 72px}
.visual{position:relative;width:min(100%,1100px);aspect-ratio:16/9;max-height:100%;border:0;padding:0;background:none;cursor:pointer;
  transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity .8s,filter .8s}
.visual img{width:100%;height:100%;object-fit:contain;display:block}
.visual::after{content:"";position:absolute;inset:-14px;border:1px solid var(--line);pointer-events:none;transition:border-color .4s}
.visual:hover::after,.visual:focus-visible::after{border-color:var(--red)}
.hint{position:absolute;left:50%;bottom:-46px;transform:translateX(-50%);font-family:var(--en);font-size:13px;letter-spacing:.4em;color:var(--muted);white-space:nowrap;transition:opacity .4s}
.hint::before{content:"";display:inline-block;width:28px;height:1px;background:var(--red);vertical-align:middle;margin-right:14px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleX(.4);opacity:.5}50%{transform:scaleX(1);opacity:1}}
body.open .visual{transform:scale(.86);opacity:.12;filter:blur(2px);pointer-events:none}
body.open .hint{opacity:0}

/* 2枚目：4つの入口 */
.doors{position:fixed;inset:0;display:grid;place-items:center;padding:96px var(--side) 80px;opacity:0;visibility:hidden;transition:opacity .6s .25s,visibility 0s .9s}
body.open .doors{opacity:1;visibility:visible;transition:opacity .6s .25s,visibility 0s}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,1180px);border-top:1px solid var(--ink)}
.door{position:relative;display:flex;flex-direction:column;min-height:clamp(260px,46vh,420px);padding:28px 26px 30px;border-right:1px solid var(--line);background:rgba(255,253,248,.72);
  transform:translateY(24px);opacity:0;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .8s,background .4s}
.door:last-child{border-right:0}
body.open .door{transform:none;opacity:1}
body.open .door:nth-child(1){transition-delay:.30s}
body.open .door:nth-child(2){transition-delay:.42s}
body.open .door:nth-child(3){transition-delay:.54s}
body.open .door:nth-child(4){transition-delay:.66s}
.door .no{font-family:var(--en);font-size:15px;letter-spacing:.2em;color:var(--red)}
.door .en{font-family:var(--en);font-weight:500;font-size:clamp(30px,3.2vw,44px);line-height:1.05;letter-spacing:.01em;margin:18px 0 14px}
.door .jp{font-size:14px;font-weight:600;letter-spacing:.06em}
.door .desc{font-size:13px;color:var(--muted);line-height:1.85;margin-top:10px}
.door .go{margin-top:auto;padding-top:22px;font-family:var(--en);font-size:14px;letter-spacing:.2em;display:flex;align-items:center;gap:12px}
.door .go::after{content:"";flex:0 0 36px;height:1px;background:var(--ink);transition:flex-basis .4s,background .4s}
a.door::before{content:"";position:absolute;left:0;right:100%;top:-1px;height:3px;background:var(--red);transition:right .5s}
a.door:hover,a.door:focus-visible{background:var(--paper)}
a.door:hover::before,a.door:focus-visible::before{right:0}
a.door:hover .go::after,a.door:focus-visible .go::after{flex-basis:64px;background:var(--red)}
.door.soon{background:transparent;cursor:default}
.door.soon .en,.door.soon .jp{color:var(--muted)}
.door.soon .go{color:var(--red)}
.door.soon .go::after{background:var(--red);opacity:.4}

a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:4px}

@media (max-width:980px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .door{min-height:clamp(180px,30vh,260px);border-bottom:1px solid var(--line)}
  .door:nth-child(2n){border-right:0}
}
@media (max-width:560px){
  body.open{overflow:auto}
  .doors{position:absolute;min-height:100%;align-items:start;padding-top:84px;padding-bottom:96px}
  .bottom{background:linear-gradient(to top,var(--cream) 70%,rgba(250,246,238,0))}
  .top{background:linear-gradient(to bottom,var(--cream) 75%,rgba(250,246,238,0))}
  .grid{grid-template-columns:1fr}
  .door{min-height:0;border-right:0;padding:22px 4px 24px}
  .door .en{font-size:30px;margin:8px 0 8px}
  .mark{font-size:22px}
  .copy{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top">
  <a class="mark" href="./" aria-label="115en トップ">115<span>en</span><small>いいご縁</small></a>
  <button class="close" type="button" id="close" aria-label="画像に戻る">CLOSE</button>
</div>

<main>
  <div class="stage">
    <button class="visual" type="button" id="open" aria-expanded="false" aria-controls="doors">
      <img src="hero.svg" alt="医療・介護・地域・仲間が、ひとつの輪でつながる絵">
      <span class="hint">ENTER</span>
    </button>
  </div>

  <nav class="doors" id="doors" aria-label="グループの入口" aria-hidden="true">
    <div class="grid">
      <a class="door" href="https://gms.115en.com/">
        <span class="no">01</span>
        <span class="en">GMS</span>
        <span class="jp">株式会社GMS</span>
        <span class="desc">病院・訪問看護の立上げと運営管理。医療・介護施設の企画運営と経営支援。</span>
        <span class="go">VISIT</span>
      </a>
      <a class="door" href="https://site.scsgo.co.jp/">
        <span class="no">02</span>
        <span class="en">Sakae Care</span>
        <span class="jp">株式会社さかえケアサービス</span>
        <span class="desc">在宅の医療と介護。すべてのイノチを∞にツナぐ。</span>
        <span class="go">VISIT</span>
      </a>
      <a class="door" href="https://tamjump.github.io/GoTo_Site/">
        <span class="no">03</span>
        <span class="en">Go To Happy Life</span>
        <span class="jp">特定非営利活動法人 GO TO HAPPY LIFE</span>
        <span class="desc">寄付を受け取り、パートナーと企画し、医療・福祉の現場で形にするNPO。</span>
        <span class="go">VISIT</span>
      </a>
      <div class="door soon" aria-disabled="true">
        <span class="no">04</span>
        <span class="en">Union</span>
        <span class="jp">組合</span>
        <span class="desc">準備中。</span>
        <span class="go">COMING SOON</span>
      </div>
    </div>
  </nav>
</main>

<div class="bottom">
  <span class="copy">&copy; 2026 115en &nbsp;/&nbsp; info@115en.com</span>
  <a class="tiger" href="tiger.html">Tiger.J.Bob</a>
</div>

<script>
(function(){
  var b=document.body,o=document.getElementById('open'),c=document.getElementById('close'),d=document.getElementById('doors');
  function show(){b.classList.add('open');o.setAttribute('aria-expanded','true');d.setAttribute('aria-hidden','false');
    setTimeout(function(){var f=d.querySelector('a.door');if(f)f.focus({preventScroll:true});},700);}
  function hide(){b.classList.remove('open');o.setAttribute('aria-expanded','false');d.setAttribute('aria-hidden','true');window.scrollTo(0,0);o.focus();}
  o.addEventListener('click',show);c.addEventListener('click',hide);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&b.classList.contains('open'))hide();});
  if(location.hash==='#enter')show();
})();
</script>
</body>
</html>
